name: Citation graph validation
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . -r requirements-research.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src experiments examples tests
      - run: node --check docs/dashboard.js
      - run: python tests/check_report.py docs/results/citations.json
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/dashboard_smoke.cjs
  benchmark:
    needs: test
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . -r requirements-research.txt
      - run: python experiments/cora_benchmark.py
      - run: python tests/check_report.py results/citations.json
      - run: cp results/citations.json docs/results/citations.json
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/dashboard_smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: citation-report
          path: results/citations.json
      - name: Publish measured report
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/results
          cp results/citations.json docs/results/citations.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results/citations.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish measured benchmark report"
          git push origin HEAD:main
